name: test

on:
  push:
    paths:
      - src/**
      - test/**
      - models/**
      - .github/workflows/test.yml
  pull_request:
    paths:
      - src/**
      - test/**
      - models/**
      - .github/workflows/test.yml
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (net10 library)
        run: dotnet test test/Sdcb.SimdPaddleOCR.UnitTests -c Release --nologo
      - name: Unit tests (ns2.0 library)
        run: dotnet test test/Sdcb.SimdPaddleOCR.UnitTests -c Release --nologo -p:UseNs20Library=true

  generate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: dataset
        with:
          path: dataset
          key: ocr-dataset-${{ hashFiles('test/Sdcb.SimdPaddleOCR.TestData/**/*.cs', 'test/Sdcb.SimdPaddleOCR.TestData/**/*.csproj') }}
      - name: Generate dataset
        if: steps.dataset.outputs.cache-hit != 'true'
        run: dotnet run --project test/Sdcb.SimdPaddleOCR.TestData -c Release -- --out dataset
      - uses: actions/upload-artifact@v7
        with:
          name: ocr-dataset
          path: dataset
          if-no-files-found: error

  smoke-platform:
    needs: generate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,     os: windows-2025,     rid: win-x64 }
          - { name: win-arm64,   os: windows-11-arm,   rid: win-arm64 }
          - { name: win-x86,     os: windows-2025,     rid: win-x86 }
          - { name: linux-x64,   os: ubuntu-24.04,     rid: linux-x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { name: osx-x64,     os: macos-26-intel,   rid: osx-x64 }
          - { name: osx-arm64,   os: macos-26,         rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ocr-dataset, path: dataset }
      - name: Run platform smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # build
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r '${{ matrix.rid }}' --no-self-contained -o artifacts/net10 --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $LASTEXITCODE" }
          $exe = if ($IsWindows) { 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests.exe' } else { 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests' }

          # run
          # GHA macOS installs to ~/.dotnet; apphost default /usr/local/share/dotnet is empty.
          # Do not set on Windows: x86 apphost would pick up the x64 install.
          if ($IsMacOS) { $env:DOTNET_ROOT = Join-Path $HOME '.dotnet' }
          if (-not $IsWindows) { chmod +x $exe }
          & $exe --smoke --count 20 --engine sharp --workers 4 --model tiny --input dataset --case-id '${{ matrix.name }}' --out '${{ matrix.name }}-smoke.json'
          if ($LASTEXITCODE -ne 0) { throw "smoke failed: $LASTEXITCODE" }
      - name: Metal smoke (osx-arm64)
        if: matrix.name == 'osx-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests'
          $env:DOTNET_ROOT = Join-Path $HOME '.dotnet'
          & $exe --smoke --count 20 --engine metal --workers 4 --model tiny --input dataset --case-id 'osx-arm64-metal' --out 'osx-arm64-metal-smoke.json' 2> metal-stderr.txt
          if ($LASTEXITCODE -ne 0) { throw "metal smoke failed: $LASTEXITCODE" }
          Get-Content metal-stderr.txt
          if (-not (Select-String -Path metal-stderr.txt -Pattern '\[metal\] device:' -Quiet)) {
            throw 'Metal device never engaged — the smoke silently ran on CPU'
          }
          if (Select-String -Path metal-stderr.txt -Pattern '\[metal\].*fallback' -Quiet) {
            throw 'metal session fell back to CPU'
          }
          $cpu = Get-Content 'osx-arm64-smoke.json' | ConvertFrom-Json
          $mtl = Get-Content 'osx-arm64-metal-smoke.json' | ConvertFrom-Json
          for ($i = 0; $i -lt $cpu.rows.Count; $i++) {
            if ($cpu.rows[$i].detected -ne $mtl.rows[$i].detected) {
              throw "metal detected-line count differs on $($cpu.rows[$i].file): $($cpu.rows[$i].detected) vs $($mtl.rows[$i].detected)"
            }
          }
          Write-Output "metal smoke OK: $($mtl.rows.Count) images, detected-line counts identical to CPU"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-platform-${{ matrix.name }}
          path: |
            ${{ matrix.name }}-smoke.json
            ${{ matrix.name }}-metal-smoke.json
          if-no-files-found: warn

  smoke-models:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ocr-dataset, path: dataset }
      - name: Run tiny/small/medium smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # build
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r linux-x64 --no-self-contained -o artifacts/net10 --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $LASTEXITCODE" }
          $exe = 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests'

          # run
          chmod +x $exe
          foreach ($model in @('tiny','small','medium')) {
            & $exe --smoke --count 20 --engine sharp --workers 4 --model $model --input dataset --case-id $model --out "model-$model-smoke.json"
            if ($LASTEXITCODE -ne 0) { throw "smoke $model failed: $LASTEXITCODE" }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-models
          path: model-*-smoke.json
          if-no-files-found: warn

  smoke-win-x64-isa:
    needs: generate
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ocr-dataset, path: dataset }
      - name: Run Windows x64 ISA smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r win-x64 --no-self-contained -o artifacts/net10 --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $LASTEXITCODE" }
          $exe = 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests.exe'
          $cases = @(
            @{ id='tiny-4w-noavx2'; isa='DOTNET_EnableAVX512=0;DOTNET_EnableAVX2=0' },
            @{ id='tiny-4w-noavx';  isa='DOTNET_EnableAVX512=0;DOTNET_EnableAVX2=0;DOTNET_EnableAVX=0' },
            @{ id='tiny-4w-scalar'; isa='DOTNET_EnableHWIntrinsic=0' }
          )
          foreach ($c in $cases) {
            Write-Output "::group::isa smoke $($c.id)"
            try {
              $saved = @{}
              foreach ($setting in $c.isa.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)) {
                $eq = $setting.IndexOf('=')
                $k = $setting.Substring(0, $eq); $v = $setting.Substring($eq + 1)
                $saved[$k] = [Environment]::GetEnvironmentVariable($k, 'Process')
                [Environment]::SetEnvironmentVariable($k, $v, 'Process')
              }
              try {
                & $exe --smoke --count 20 --warmup 1 --engine sharp --workers 4 --model tiny --input dataset --case-id $c.id --out "isa-$($c.id)-smoke.json"
                if ($LASTEXITCODE -ne 0) { throw "isa smoke $($c.id) failed: $LASTEXITCODE" }
              }
              finally {
                foreach ($k in $saved.Keys) { [Environment]::SetEnvironmentVariable($k, $saved[$k], 'Process') }
              }
            }
            finally { Write-Output '::endgroup::' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-win-x64-isa
          path: isa-*-smoke.json
          if-no-files-found: warn

  bench-win-x64-simd:
    needs: generate
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # 6 replicas: Pro concurrency can run these in parallel; more samples
      # cut runner/ISA noise (7763 vs 9V74, M1 spread).
      matrix: { replica: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ocr-dataset, path: dataset }
      - name: Run Windows x64 benchmark suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name -ErrorAction SilentlyContinue)
          if ($cpu) { $cpu = $cpu.Trim() } else { $cpu = 'unknown' }
          $cs = Get-CimInstance Win32_ComputerSystem -ErrorAction SilentlyContinue
          $memoryGb = if ($cs -and $cs.TotalPhysicalMemory) { [math]::Round($cs.TotalPhysicalMemory / 1GB, 1) } else { 'unknown' }
          $memorySpeed = (Get-CimInstance Win32_PhysicalMemory -ErrorAction SilentlyContinue | Where-Object { $_.Speed -gt 0 } | Measure-Object -Property Speed -Average).Average
          $memorySpeedText = if ($memorySpeed) { "$([math]::Round($memorySpeed)) MHz" } else { 'unknown' }
          $hostInfo = "machine=$env:COMPUTERNAME os=$([System.Environment]::OSVersion.VersionString) logicalCpu=$([System.Environment]::ProcessorCount) cpu=$cpu memory=$memoryGb GB memorySpeed=$memorySpeedText"
          Write-Output "Benchmark host: $hostInfo"
          Write-Output "::notice title=Benchmark host::$hostInfo"

          # build
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r win-x64 --no-self-contained -o artifacts/net10 --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $LASTEXITCODE" }
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r win-x64 --no-self-contained -o artifacts/ns20 --nologo -p:UseNs20Library=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet build ns20 failed: $LASTEXITCODE" }
          $exeNet10 = 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests.exe'
          $exeNs20 = 'artifacts/ns20/Sdcb.SimdPaddleOCR.Tests.exe'

          # Cold GHA VMs bias the first process by ~25%. Heat the machine
          # with a discarded default tiny-4w; later cases use --warmup 1.
          Write-Output "::group::vm warmup tiny-4w x25 (not uploaded)"
          try {
            & $exeNet10 --benchmark --benchmark-kind simd --engine sharp --workers 4 --model tiny --input dataset --count 25 --warmup 0 --case-id vm-warmup --replica '${{ matrix.replica }}' --out vm-warmup.json
            if ($LASTEXITCODE -ne 0) { throw "vm warmup failed: $LASTEXITCODE" }
          }
          finally { Write-Output '::endgroup::' }

          $base = 'win-x64-simd'
          $cases = @(
            @{ id='tiny-4w';          engine='sharp';    workers=4; model='tiny'; isa='' },
            @{ id='tiny-4w-noavx512'; engine='sharp';    workers=4; model='tiny'; isa='DOTNET_EnableAVX512=0' },
            @{ id='tiny-4w-ns2';      engine='sharp';    workers=4; model='tiny'; isa=''; ns2=$true }
          )
          foreach ($c in $cases) {
            Write-Output "::group::benchmark case $($c.id) (replica ${{ matrix.replica }})"
            try {
              $exe = if ($c.ns2) { $exeNs20 } else { $exeNet10 }
              $out = "$base-$($c.id)-r${{ matrix.replica }}.json"
              $appArgs = @('--benchmark','--benchmark-kind','simd','--engine',$c.engine,'--workers',$c.workers,'--model',$c.model,'--input','dataset',
                '--warmup','1','--case-id',$c.id,'--replica','${{ matrix.replica }}','--out',$out)
              $saved = @{}
              if ($c.isa) {
                foreach ($setting in $c.isa.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)) {
                  $eq = $setting.IndexOf('=')
                  $k = $setting.Substring(0, $eq); $v = $setting.Substring($eq + 1)
                  $saved[$k] = [Environment]::GetEnvironmentVariable($k, 'Process')
                  [Environment]::SetEnvironmentVariable($k, $v, 'Process')
                }
              }
              try {
                & $exe @appArgs
                if ($LASTEXITCODE -ne 0) { throw "bench failed: $LASTEXITCODE" }
              }
              finally {
                foreach ($k in $saved.Keys) { [Environment]::SetEnvironmentVariable($k, $saved[$k], 'Process') }
              }
            }
            finally { Write-Output '::endgroup::' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-win-x64-simd-r${{ matrix.replica }}
          path: win-x64-simd-*.json
          if-no-files-found: warn

  bench-win-x64-engines:
    needs: generate
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # 6 replicas: Pro concurrency can run these in parallel; more samples
      # cut runner/ISA noise (7763 vs 9V74, M1 spread).
      matrix: { replica: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ocr-dataset, path: dataset }
      - name: Run Windows x64 engine comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name -ErrorAction SilentlyContinue)
          if ($cpu) { $cpu = $cpu.Trim() } else { $cpu = 'unknown' }
          $cs = Get-CimInstance Win32_ComputerSystem -ErrorAction SilentlyContinue
          $memoryGb = if ($cs -and $cs.TotalPhysicalMemory) { [math]::Round($cs.TotalPhysicalMemory / 1GB, 1) } else { 'unknown' }
          $memorySpeed = (Get-CimInstance Win32_PhysicalMemory -ErrorAction SilentlyContinue | Where-Object { $_.Speed -gt 0 } | Measure-Object -Property Speed -Average).Average
          $memorySpeedText = if ($memorySpeed) { "$([math]::Round($memorySpeed)) MHz" } else { 'unknown' }
          $hostInfo = "machine=$env:COMPUTERNAME os=$([System.Environment]::OSVersion.VersionString) logicalCpu=$([System.Environment]::ProcessorCount) cpu=$cpu memory=$memoryGb GB memorySpeed=$memorySpeedText"
          Write-Output "Benchmark host: $hostInfo"
          Write-Output "::notice title=Benchmark host::$hostInfo"

          # build
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r win-x64 --no-self-contained -o artifacts/net10 --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $LASTEXITCODE" }
          $exe = 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests.exe'

          # run
          $base = 'win-x64-engines'
          $cases = @(
            @{ id='tiny-1w';      engine='sharp';    workers=1; model='tiny' },
            @{ id='tiny-4w';      engine='sharp';    workers=4; model='tiny' },
            @{ id='tiny-c-1w';    engine='c';        workers=1; model='tiny' },
            @{ id='tiny-c-4w';    engine='c';        workers=4; model='tiny' }
          )
          foreach ($c in $cases) {
            Write-Output "::group::benchmark case $($c.id) (replica ${{ matrix.replica }})"
            try {
              $out = "$base-$($c.id)-r${{ matrix.replica }}.json"
              & $exe --benchmark --benchmark-kind engine --engine $c.engine --workers $c.workers --model $c.model --input dataset --case-id $c.id --replica '${{ matrix.replica }}' --out $out
              if ($LASTEXITCODE -ne 0) { throw "bench failed: $LASTEXITCODE" }
            }
            finally { Write-Output '::endgroup::' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-win-x64-engines-r${{ matrix.replica }}
          path: win-x64-engines-*.json
          if-no-files-found: warn

  bench-linux-arm64:
    needs: generate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # 6 replicas: Pro concurrency can run these in parallel; more samples
      # cut runner/ISA noise (7763 vs 9V74, M1 spread).
      matrix: { replica: [1, 2, 3, 4, 5, 6] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ocr-dataset, path: dataset }
      - name: Run ARM64 benchmark suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cpu = if (Get-Command lscpu -ErrorAction SilentlyContinue) {
            (& lscpu 2>$null | Select-String '^Model name:|^Model:|^Hardware:|^Architecture:' | Select-Object -First 1).Line
          } else {
            (Get-Content /proc/cpuinfo -ErrorAction SilentlyContinue | Select-String '^model name|^Hardware|^CPU part' | Select-Object -First 1).Line
          }
          if ([string]::IsNullOrWhiteSpace($cpu)) { $cpu = 'unknown' }
          $memoryLine = Get-Content /proc/meminfo -ErrorAction SilentlyContinue | Select-String '^MemTotal:' | Select-Object -First 1
          $memoryKb = if ($memoryLine -and $memoryLine.Line -match '^MemTotal:\s*([0-9]+)') { $Matches[1] } else { $null }
          $memoryGb = if ($memoryKb) { [math]::Round(([double]$memoryKb / 1MB), 1) } else { 'unknown' }
          $memorySpeed = 'unknown'
          if (Get-Command dmidecode -ErrorAction SilentlyContinue) {
            $speedLine = & dmidecode --type memory 2>$null | Select-String 'Configured Memory Speed:|Speed:' | Select-Object -First 1
            if ($speedLine -and $speedLine.Line -match '([0-9]+) MT/s') { $memorySpeed = "$($Matches[1]) MT/s" }
          }
          $hostInfo = "machine=$env:HOSTNAME os=$([System.Environment]::OSVersion.VersionString) logicalCpu=$([System.Environment]::ProcessorCount) cpu=$($cpu.Trim()) memory=$memoryGb GB memorySpeed=$memorySpeed"
          Write-Output "Benchmark host: $hostInfo"
          Write-Output "::notice title=Benchmark host::$hostInfo"

          # build
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r linux-arm64 --no-self-contained -o artifacts/net10 --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $LASTEXITCODE" }
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r linux-arm64 --no-self-contained -o artifacts/ns20 --nologo -p:UseNs20Library=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet build ns20 failed: $LASTEXITCODE" }
          $exeNet10 = 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests'
          $exeNs20 = 'artifacts/ns20/Sdcb.SimdPaddleOCR.Tests'

          # run
          chmod +x $exeNet10
          chmod +x $exeNs20
          $base = 'linux-arm64'
          $cases = @(
            @{ id='tiny-1w';         workers=1; model='tiny'; isa='' },
            @{ id='tiny-4w';         workers=4; model='tiny'; isa='' },
            @{ id='tiny-4w-ns2';     workers=4; model='tiny'; isa=''; ns2=$true },
            @{ id='tiny-4w-scalar';  workers=4; model='tiny'; isa='DOTNET_EnableHWIntrinsic=0' }
            # Add an explicit AdvSimd case here when that implementation is
            # available; it will be compared with tiny-4w on this replica.
          )
          foreach ($c in $cases) {
            Write-Output "::group::benchmark case $($c.id) (replica ${{ matrix.replica }})"
            try {
              $exe = if ($c.ns2) { $exeNs20 } else { $exeNet10 }
              $out = "$base-$($c.id)-r${{ matrix.replica }}.json"
              $appArgs = @('--benchmark','--benchmark-kind','simd','--engine','sharp','--workers',$c.workers,'--model',$c.model,'--input','dataset',
                '--case-id',$c.id,'--replica','${{ matrix.replica }}','--out',$out)
              $saved = @{}
              if ($c.isa) {
                foreach ($setting in $c.isa.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)) {
                  $eq = $setting.IndexOf('=')
                  $k = $setting.Substring(0, $eq); $v = $setting.Substring($eq + 1)
                  $saved[$k] = [Environment]::GetEnvironmentVariable($k, 'Process')
                  [Environment]::SetEnvironmentVariable($k, $v, 'Process')
                }
              }
              try {
                & $exe @appArgs
                if ($LASTEXITCODE -ne 0) { throw "bench failed: $LASTEXITCODE" }
              }
              finally {
                foreach ($k in $saved.Keys) { [Environment]::SetEnvironmentVariable($k, $saved[$k], 'Process') }
              }
            }
            finally { Write-Output '::endgroup::' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-linux-arm64-r${{ matrix.replica }}
          path: linux-arm64-*.json
          if-no-files-found: warn

  bench-osx-arm64:
    needs: generate
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # GitHub Pro macOS concurrency is 5; extra replicas would just queue, and needs to reserve 2 for other jobs.
      matrix: { replica: [1, 2, 3] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: ocr-dataset, path: dataset }
      - name: Run macOS ARM64 worker benchmark
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cpu = (& sysctl -n machdep.cpu.brand_string 2>$null)
          if ([string]::IsNullOrWhiteSpace($cpu) -and (Get-Command system_profiler -ErrorAction SilentlyContinue)) {
            $cpu = (& system_profiler SPHardwareDataType 2>$null | Select-String 'Chip:|Processor Name:' | Select-Object -First 1).Line
            if ($cpu -match ':\s*(.+)$') { $cpu = $Matches[1] }
          }
          if ($cpu) { $cpu = $cpu.Trim() }
          if ([string]::IsNullOrWhiteSpace($cpu)) { $cpu = 'unknown' }
          $memoryBytes = (& sysctl -n hw.memsize 2>$null)
          if ($memoryBytes) { $memoryBytes = $memoryBytes.Trim() }
          $memoryGb = if ($memoryBytes -match '^[0-9]+$') { [math]::Round(([double]$memoryBytes / 1GB), 1) } else { 'unknown' }
          $memorySpeed = 'unknown'
          if (Get-Command system_profiler -ErrorAction SilentlyContinue) {
            $speedLine = & system_profiler SPMemoryDataType 2>$null | Select-String 'Speed:' | Select-Object -First 1
            if ($speedLine -and $speedLine.Line -match 'Speed:\s*(.+)$') { $memorySpeed = $Matches[1].Trim() }
          }
          $hostInfo = "machine=$env:HOSTNAME os=$([System.Environment]::OSVersion.VersionString) logicalCpu=$([System.Environment]::ProcessorCount) cpu=$cpu memory=$memoryGb GB memorySpeed=$memorySpeed"
          Write-Output "Benchmark host: $hostInfo"
          Write-Output "::notice title=Benchmark host::$hostInfo"

          # build
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r osx-arm64 --no-self-contained -o artifacts/net10 --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $LASTEXITCODE" }
          dotnet build test/Sdcb.SimdPaddleOCR.Tests -c Release -r osx-arm64 --no-self-contained -o artifacts/ns20 --nologo -p:UseNs20Library=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet build ns20 failed: $LASTEXITCODE" }
          $exeNet10 = 'artifacts/net10/Sdcb.SimdPaddleOCR.Tests'
          $exeNs20 = 'artifacts/ns20/Sdcb.SimdPaddleOCR.Tests'

          # run
          $env:DOTNET_ROOT = Join-Path $HOME '.dotnet'
          chmod +x $exeNet10
          chmod +x $exeNs20
          $base = 'osx-arm64'
          $cases = @(
            @{ id='tiny-1w';         workers=1; model='tiny'; isa='' },
            @{ id='tiny-4w';         workers=4; model='tiny'; isa='' },
            @{ id='tiny-4w-ns2';     workers=4; model='tiny'; isa=''; ns2=$true }
          )
          foreach ($c in $cases) {
            Write-Output "::group::benchmark case $($c.id) (replica ${{ matrix.replica }})"
            try {
              $exe = if ($c.ns2) { $exeNs20 } else { $exeNet10 }
              $out = "$base-$($c.id)-r${{ matrix.replica }}.json"
              $appArgs = @('--benchmark','--benchmark-kind','simd','--engine','sharp','--workers',$c.workers,'--model',$c.model,'--input','dataset',
                '--case-id',$c.id,'--replica','${{ matrix.replica }}','--out',$out)
              $saved = @{}
              if ($c.isa) {
                foreach ($setting in $c.isa.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)) {
                  $eq = $setting.IndexOf('=')
                  $k = $setting.Substring(0, $eq); $v = $setting.Substring($eq + 1)
                  $saved[$k] = [Environment]::GetEnvironmentVariable($k, 'Process')
                  [Environment]::SetEnvironmentVariable($k, $v, 'Process')
                }
              }
              try {
                & $exe @appArgs
                if ($LASTEXITCODE -ne 0) { throw "bench failed: $LASTEXITCODE" }
              }
              finally {
                foreach ($k in $saved.Keys) { [Environment]::SetEnvironmentVariable($k, $saved[$k], 'Process') }
              }
            }
            finally { Write-Output '::endgroup::' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-osx-arm64-r${{ matrix.replica }}
          path: osx-arm64-*.json
          if-no-files-found: warn

  report:
    needs: [smoke-platform, smoke-models, smoke-win-x64-isa, bench-win-x64-simd, bench-win-x64-engines, bench-linux-arm64, bench-osx-arm64]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { actions: write, contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: bench-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: smoke-*
          path: results
          merge-multiple: true
      - name: Build markdown report
        run: |
          dotnet run --project test/Sdcb.SimdPaddleOCR.TestReport -c Release -- --in results --out results/report.md
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: results
          if-no-files-found: error
      - name: Delete individual result artifacts
        continue-on-error: true   # best-effort cleanup; fork PRs run with a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select((.name | startswith("bench-")) or (.name | startswith("smoke-"))) | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              done
